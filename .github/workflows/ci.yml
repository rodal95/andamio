name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Una vez por semana aunque nadie suba nada: los proyectos generados dependen de
  # paquetes de npm y de PyPI, y del entorno de GitHub, que cambian solos.
  schedule:
    - cron: "23 6 * * 1"  # lunes 06:23 UTC
  # A mano (Actions > Tests > Run workflow), sobre cualquier rama: para probar un
  # arreglo antes de subirlo a main.
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar andamio y pytest
        run: python -m pip install -e ".[dev]"
      - name: Instalar las dependencias de los proyectos Django y FastAPI generados
        run: |
          python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
          # La versión de SimpleJWT que agrega 'nuevo login' (VERSION_SIMPLEJWT en andamio/stacks/django.py).
          python -m pip install "djangorestframework-simplejwt~=$(python -c 'from andamio.stacks.django import VERSION_SIMPLEJWT; print(VERSION_SIMPLEJWT)')"
          python -m pip install -r andamio/plantillas/fastapi/_proyecto/requirements.txt
          # La versión de PyJWT que agrega 'nuevo login' en FastAPI (VERSION_PYJWT en andamio/stacks/fastapi.py).
          python -m pip install "PyJWT~=$(python -c 'from andamio.stacks.fastapi import VERSION_PYJWT; print(VERSION_PYJWT)')"
      - name: Tests
        run: python -m pytest

  # Instala las dependencias de los proyectos generados y los compila:
  # npm install + build (React y Next.js), tsc (React Native), npm test (Express y Next.js full
  # stack), Reflex (reflex run), y servicios y CRUD en el navegador contra las APIs de Django,
  # FastAPI, Express y Next.js.
  lento:
    name: Proyectos generados (--lento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar andamio, pytest y las dependencias de Django, FastAPI y Reflex
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
          # La versión de SimpleJWT que agrega 'nuevo login' (VERSION_SIMPLEJWT en andamio/stacks/django.py).
          python -m pip install "djangorestframework-simplejwt~=$(python -c 'from andamio.stacks.django import VERSION_SIMPLEJWT; print(VERSION_SIMPLEJWT)')"
          python -m pip install -r andamio/plantillas/fastapi/_proyecto/requirements.txt
          python -m pip install "PyJWT~=$(python -c 'from andamio.stacks.fastapi import VERSION_PYJWT; print(VERSION_PYJWT)')"
          python -m pip install -r andamio/plantillas/reflex/_proyecto/requirements.txt
      - name: Playwright (prueba en el navegador del CRUD generado) y TypeScript (barrido de nombres)
        run: |
          npm install -g playwright@1.63.0 typescript@6.0.2
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Tests lentos
        run: python -m pytest --lento
