name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar andamio y pytest
        run: python -m pip install -e ".[dev]"
      - name: Instalar las dependencias del proyecto Django generado
        run: python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
      - name: Tests
        run: python -m pytest

  # Instala las dependencias de los proyectos generados y los compila:
  # npm install + build (React), tsc (React Native) y servicios contra la API de Django.
  lento:
    name: Proyectos generados (--lento)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar andamio, pytest y las dependencias de Django
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
      - name: Playwright (prueba en el navegador del CRUD generado)
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Tests lentos
        run: python -m pytest --lento
