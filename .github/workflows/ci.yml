name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar andamio y pytest
        run: python -m pip install -e ".[dev]"
      - name: Instalar las dependencias del proyecto Django generado
        run: python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
      - name: Tests
        run: python -m pytest
