name: Release

# Se ejecuta al subir un tag de versión, por ejemplo:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verificar que el tag coincide con la versión de andamio
        run: |
          VERSION=$(python -c "import andamio; print(andamio.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con __version__ = $VERSION (andamio/__init__.py)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
          python -m pytest

      - name: Armar el .whl, andamio.pyz y el .zip
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python scripts/empaquetar.py dist
          ls -l dist

      - name: Probar lo que se va a publicar
        run: |
          python -m venv /tmp/prueba
          /tmp/prueba/bin/pip install dist/*.whl
          /tmp/prueba/bin/andamio --version
          cd "$(mktemp -d)"
          /tmp/prueba/bin/andamio crear react web
          test -f web/.env.example && test -f web/src/hooks/.gitkeep
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear django api
          test -f api/.env.example

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/empaquetar.py notas "$VERSION" > notas.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "andamio $GITHUB_REF_NAME" --notes-file notas.md
