name: Release

# Se ejecuta de cualquiera de estas tres formas:
# - subiendo un tag de versión:  git tag v1.0.0 && git push origin v1.0.0
# - publicando una Release desde la web de GitHub con un tag nuevo (v1.0.0):
#   el workflow le agrega los archivos y las notas del CHANGELOG.
# - a mano, desde Actions > Release > Run workflow (sobre main): crea el tag
#   v<versión de andamio/__init__.py> y la Release. Sirve cuando no se pueden subir tags
#   (por ejemplo, desde una sesión de Claude Code en la nube).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# Si se disparan los dos eventos para el mismo tag, se ejecutan uno después del otro.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verificar que el tag coincide con la versión de andamio
        run: |
          VERSION=$(python -c "import andamio; print(andamio.__version__)")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A mano: el tag sale de la versión, y no puede existir todavía.
            TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Las versiones se publican desde main (se ejecutó sobre $GITHUB_REF_NAME)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "::error::El tag $TAG ya existe: subí la versión en andamio/__init__.py y en el CHANGELOG"
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if [ "v$VERSION" != "$TAG" ]; then
              echo "::error::El tag $TAG no coincide con __version__ = $VERSION (andamio/__init__.py)"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r andamio/plantillas/django/_proyecto/requirements.txt
          # La versión de SimpleJWT que agrega 'nuevo login' (sin esto, los tests del login se saltean).
          python -m pip install "djangorestframework-simplejwt~=$(python -c 'from andamio.stacks.django import VERSION_SIMPLEJWT; print(VERSION_SIMPLEJWT)')"
          python -m pip install -r andamio/plantillas/fastapi/_proyecto/requirements.txt
          python -m pytest

      - name: Armar el .whl, andamio.pyz y el .zip
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          python scripts/empaquetar.py dist
          ls -l dist

      - name: Probar lo que se va a publicar
        run: |
          python -m venv /tmp/prueba
          /tmp/prueba/bin/pip install dist/*.whl
          /tmp/prueba/bin/andamio --version
          cd "$(mktemp -d)"
          /tmp/prueba/bin/andamio crear react web
          test -f web/.env.example && test -f web/src/hooks/.gitkeep
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear django api
          test -f api/.env.example
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear fastapi api-rapida
          test -f api-rapida/app/main.py && test -f api-rapida/.gitignore
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear express api-node --js
          test -f api-node/src/app.js && test -f api-node/prisma/schema.prisma && test -f api-node/.gitignore
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear next-fullstack app-next
          test -f app-next/app/layout.tsx && test -f app-next/prisma/schema.prisma && test -f app-next/proxy.ts
          python "$GITHUB_WORKSPACE/dist/andamio.pyz" crear reflex app-reflex
          test -f app-reflex/rxconfig.py && test -f app-reflex/app_reflex/app_reflex.py

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/empaquetar.py notas "$VERSION" > notas.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # La Release ya existe (creada desde la web): se completan archivos y notas.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "andamio $TAG" --notes-file notas.md
          else
            # Si el tag no existe (ejecución a mano), gh lo crea sobre este commit.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "andamio $TAG" --notes-file notas.md
          fi
