{% extends "base.html" %}

{% block titulo %}Eliminar {{ @@nombre@@ }}{% endblock %}

{% block contenido %}
  <h1>¿Eliminar «{{ @@nombre@@ }}»?</h1>
  <p>Esta acción no se puede deshacer.</p>

  <form method="post" class="acciones">
    {% csrf_token %}
    <button type="submit" class="boton boton--peligro">Sí, eliminar</button>
    <a href="{% url '@@plural@@:detalle' @@nombre@@.pk %}">Cancelar</a>
  </form>
{% endblock %}
