<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ingresar</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <script type="module" src="js/paginas/ingresar.js"></script>
  </head>
  <body>
    <header class="barra" data-menu></header>

    <main class="contenido">
      <h1>Ingresar</h1>
      <form id="formulario" class="formulario" novalidate>
        <div class="campo">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" required />
          <small class="error" id="error-username"></small>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <small class="error" id="error-password"></small>
        </div>
        <p class="error" id="error-general"></p>
        <div>
          <button type="submit" class="boton">Ingresar</button>
        </div>
      </form>
      @@pie_ingresar@@
    </main>
    <footer class="pie" data-pie></footer>
  </body>
</html>
